<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Impostor Fútbol</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      width: 320px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    button {
      background: #1f6feb;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #388bfd; }
    input {
      padding: 8px;
      width: 80%;
      border-radius: 6px;
      border: none;
      margin: 5px;
    }
    ul { list-style: none; padding: 0; }
    li {
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      background: #21262d;
      cursor: pointer;
    }
    li:hover { background: #30363d; }
  </style>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBB2m__o-fKBuQHbJ0jX1q78jCsGUjWRfo",
      authDomain: "impostor-futbol-79a3e.firebaseapp.com",
      databaseURL: "https://impostor-futbol-79a3e-default-rtdb.firebaseio.com",
      projectId: "impostor-futbol-79a3e",
      storageBucket: "impostor-futbol-79a3e.firebasestorage.app",
      messagingSenderId: "444634288697",
      appId: "1:444634288697:web:93398a6c5538df2684b3e8",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const jugadoresFamosos = [
      "Lionel Messi","Cristiano Ronaldo","Pelé","Maradona","Zidane",
      "Ronaldinho","Mbappé","Neymar","Haaland","Lewandowski",
      "Beckham","Beckenbauer","Ronaldo Nazário","Iniesta","Xavi",
      "Henry","Maldini","George Best","Luis Suárez","Modrić",
      "Buffon","Salah","Ramos","Valderrama","James Rodríguez",
      "Drogba","Rooney","Lampard","Gerrard","Casillas",
      "Zlatan","Kaká","Pirlo","Seedorf","Roberto Carlos",
      "Marcelo","Van Dijk","Griezmann","Cavani","Rivaldo",
      "Eto'o","Nedvěd","Gullit","Torres","Foden",
      "Bellingham","Enzo Fernández","Mané","Vinícius Jr","Alisson"
    ];

    function generarCodigo() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    }

    // 🔹 Crear sala
    window.crearSala = async function() {
      const codigo = generarCodigo();
      const salaRef = ref(db, "salas/" + codigo);
      await set(salaRef, { jugadores: {}, iniciada: false, enVotacion: false, votos: {} });
      document.getElementById("menu").innerHTML = `
        <div class="card">
          <h3>Sala creada</h3>
          <p>Código de sala: <b>${codigo}</b></p>
          <input id="nombreJugador" placeholder="Tu nombre" />
          <button onclick="unirseSala('${codigo}', true)">Unirme</button>
        </div>
      `;
    }

    // 🔹 Unirse a sala
    window.unirseSala = async function(codigoManual = null, esCreador = false) {
      const codigo = codigoManual || document.getElementById("codigoSala").value.trim().toUpperCase();
      const nombre = document.getElementById("nombreJugador").value.trim();
      if (!nombre) return alert("Ingresa un nombre");

      const salaRef = ref(db, "salas/" + codigo);
      const snapshot = await get(salaRef);
      if (!snapshot.exists()) return alert("Sala no encontrada");

      const jugadorRef = ref(db, "salas/" + codigo + "/jugadores/" + nombre);
      await set(jugadorRef, { nombre, rol: "esperando", vivo: true });

      document.getElementById("menu").innerHTML = `
        <div class="card">
          <h3>Sala: ${codigo}</h3>
          <div id="estadoSala">Esperando jugadores...</div>
          <ul id="listaJugadores"></ul>
          ${esCreador ? `<button onclick="iniciarPartida('${codigo}')">Iniciar Partida</button>` : ""}
        </div>
      `;

      onValue(salaRef, (snap) => {
        const info = snap.val();
        const jugadores = Object.values(info.jugadores || {});
        document.getElementById("listaJugadores").innerHTML = jugadores.map(j => `<li>${j.nombre}${!j.vivo ? " 💀" : ""}</li>`).join("");

        if (info.iniciada && info.jugadores[nombre]) {
          const jugador = info.jugadores[nombre];
          if (!info.enVotacion && jugador.rol && jugador.vivo) {
            document.body.innerHTML = `
              <div class="card">
                <h2>Tu jugador: ${info.futbolista}</h2>
                <h3>${jugador.rol === "impostor" ? "Eres el IMPOSTOR ⚠️" : "Eres inocente ⚽"}</h3>
                <button onclick="iniciarVotacion('${codigo}')">Ir a votación</button>
              </div>
            `;
          } else if (info.enVotacion) {
            mostrarPantallaVotacion(codigo, nombre, info);
          }
          if (info.resultado) mostrarResultado(info.resultado);
        }
      });
    }

    // 🔹 Iniciar partida
    window.iniciarPartida = async function(codigo) {
      const salaRef = ref(db, "salas/" + codigo);
      const snapshot = await get(salaRef);
      const sala = snapshot.val();
      const jugadores = Object.keys(sala.jugadores);
      if (jugadores.length < 3) return alert("Se necesitan mínimo 3 jugadores.");

      const futbolista = jugadoresFamosos[Math.floor(Math.random() * jugadoresFamosos.length)];
      const numImpostores = jugadores.length >= 5 ? 2 : 1;
      const impostores = [];

      while (impostores.length < numImpostores) {
        const rand = jugadores[Math.floor(Math.random() * jugadores.length)];
        if (!impostores.includes(rand)) impostores.push(rand);
      }

      let updates = { iniciada: true, futbolista };
      jugadores.forEach(j => {
        updates["jugadores/" + j + "/rol"] = impostores.includes(j) ? "impostor" : "inocente";
      });
      await update(salaRef, updates);
    }

    // 🔹 Iniciar votación
    window.iniciarVotacion = async function(codigo) {
      const salaRef = ref(db, "salas/" + codigo);
      await update(salaRef, { enVotacion: true, votos: {} });
    }

    // 🔹 Mostrar pantalla de votación
    window.mostrarPantallaVotacion = function(codigo, nombre, info) {
      const jugadores = Object.values(info.jugadores).filter(j => j.vivo);
      document.body.innerHTML = `
        <div class="card">
          <h2>Votación</h2>
          <p>Selecciona a quién crees que es el impostor:</p>
          <ul>
            ${jugadores.map(j => `<li onclick="votar('${codigo}','${nombre}','${j.nombre}')">${j.nombre}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    // 🔹 Registrar voto
    window.votar = async function(codigo, votante, votado) {
      const salaRef = ref(db, "salas/" + codigo + "/votos/" + votante);
      await set(salaRef, votado);

      const generalRef = ref(db, "salas/" + codigo);
      const snap = await get(generalRef);
      const info = snap.val();
      const totalJugadores = Object.values(info.jugadores).filter(j => j.vivo).length;
      const votosEmitidos = Object.keys(info.votos || {}).length + 1;

      if (votosEmitidos >= totalJugadores) {
        // Contar votos
        let conteo = {};
        Object.values(info.votos || {}).forEach(v => conteo[v] = (conteo[v] || 0) + 1);
        conteo[votado] = (conteo[votado] || 0) + 1; // incluir este voto
        const expulsado = Object.keys(conteo).reduce((a,b) => conteo[a] > conteo[b] ? a : b);

        const jugadorExpulsado = info.jugadores[expulsado];
        let resultado;
        if (jugadorExpulsado.rol === "impostor") {
          resultado = "¡Ganaron los inocentes! 🎉";
        } else {
          resultado = expulsado + " no era el impostor... 😬";
          info.jugadores[expulsado].vivo = false;
        }

        await update(generalRef, { resultado, enVotacion: false, jugadores: info.jugadores });
      } else {
        alert("Voto registrado. Esperando a los demás...");
      }
    }

    // 🔹 Mostrar resultado final o mensaje
    window.mostrarResultado = function(msg) {
      document.body.innerHTML = `
        <div class="card">
          <h2>${msg}</h2>
          <button onclick="location.reload()">Volver al inicio</button>
        </div>
      `;
    }
  </script>
</head>

<body>
  <div id="menu">
    <div class="card">
      <h1>⚽ El Impostor Fútbol</h1>
      <button onclick="crearSala()">Crear Sala</button>
      <hr>
      <input id="codigoSala" placeholder="Código de sala" maxlength="6" />
      <input id="nombreJugador" placeholder="Tu nombre" />
      <button onclick="unirseSala()">Unirse a Sala</button>
    </div>
  </div>
</body>
</html>
