<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>El Impostor Fútbol</title>
<style>
  body { font-family: Arial, sans-serif; background:#0d1117; color:#fff; text-align:center; padding:18px; }
  .card { background:#161b22; border-radius:10px; padding:18px; margin:16px auto; width:320px; box-shadow:0 0 10px rgba(255,255,255,0.06); }
  button{ background:#1f6feb; color:#fff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; margin-top:8px; }
  button.ghost{ background:transparent; border:1px solid rgba(255,255,255,0.08); color:#cbd5e1; }
  input{ padding:8px; width:80%; border-radius:6px; border:none; margin:6px 0; }
  ul{ list-style:none; padding:0; margin:0; }
  li{ background:#21262d; padding:8px; margin:8px 0; border-radius:6px; cursor:pointer; }
  li:hover{ background:#2b3239; }
  .small{ color:#9aa4b2; font-size:0.9rem; }
</style>
</head>
<body>
  <div id="menu">
    <div class="card">
      <h1>⚽ El Impostor Fútbol</h1>
      <button id="btnCrear">Crear Sala</button>
      <hr style="border:none;height:1px;background:rgba(255,255,255,0.03);margin:10px 0;">
      <input id="codigoSala" placeholder="Código de sala" maxlength="6" />
      <input id="nombreJugador" placeholder="Tu nombre" />
      <button id="btnUnirse">Unirse a Sala</button>
      <p class="small">Crea una sala y comparte el código con tus amigos.</p>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBB2m__o-fKBuQHbJ0jX1q78jCsGUjWRfo",
    authDomain: "impostor-futbol-79a3e.firebaseapp.com",
    databaseURL: "https://impostor-futbol-79a3e-default-rtdb.firebaseio.com",
    projectId: "impostor-futbol-79a3e",
    storageBucket: "impostor-futbol-79a3e.firebasestorage.app",
    messagingSenderId: "444634288697",
    appId: "1:444634288697:web:93398a6c5538df2684b3e8",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const jugadoresFamosos = [
    "Lionel Messi","Cristiano Ronaldo","Pelé","Diego Maradona","Zinedine Zidane","Ronaldinho",
    "Kylian Mbappé","Neymar Jr","Erling Haaland","Robert Lewandowski","David Beckham","Ronaldo Nazário",
    "Andrés Iniesta","Xavi Hernández","Thierry Henry","Paolo Maldini","George Best","Luis Suárez",
    "Luka Modrić","Gianluigi Buffon","Mohamed Salah","Sergio Ramos","James Rodríguez","Didier Drogba",
    "Wayne Rooney","Frank Lampard","Iker Casillas","Zlatan Ibrahimović","Kaká","Pirlo","Roberto Carlos"
  ];

  const btnCrear = document.getElementById("btnCrear");
  const btnUnirse = document.getElementById("btnUnirse");

  btnCrear.onclick = crearSala;
  btnUnirse.onclick = () => unirseSala();

  function generarCodigo() {
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    return Array.from({length:6}, ()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  }

  async function crearSala(){
    const codigo = generarCodigo();
    const salaRef = ref(db, "salas/" + codigo);
    await set(salaRef, { jugadores: {}, iniciada: false, enVotacion: false, votos: {}, resultado: null, host: null });
    document.getElementById('menu').innerHTML = `
      <div class="card">
        <h3>Sala creada</h3>
        <p>Código: <strong>${codigo}</strong></p>
        <input id="nombreJugador" placeholder="Tu nombre (host)" />
        <button id="btnUnirmeHost">Unirme como host</button>
      </div>`;
    document.getElementById('btnUnirmeHost').onclick = () => unirseSala(codigo, true);
  }

  async function unirseSala(codigoManual = null, esHost = false){
    const codigo = codigoManual || document.getElementById('codigoSala').value.trim().toUpperCase();
    const nombre = document.getElementById('nombreJugador').value.trim();
    if(!codigo || !nombre) return alert("Faltan datos");

    const salaRef = ref(db, "salas/" + codigo);
    const snap = await get(salaRef);
    if(!snap.exists()) return alert("Sala no encontrada");

    if(esHost) await update(salaRef, { host: nombre });

    await set(ref(db, `salas/${codigo}/jugadores/${nombre}`), { nombre, rol: 'esperando', vivo: true });

    document.getElementById('menu').innerHTML = `
      <div class="card">
        <h3>Sala: ${codigo}</h3>
        <div id="estadoSala">Esperando jugadores...</div>
        <ul id="listaJugadores"></ul>
        <div id="botonesHost"></div>
      </div>`;

    onValue(salaRef, (s) => actualizarSala(s, codigo, nombre));
  }

  async function iniciarPartida(codigo){
    const salaRef = ref(db, "salas/" + codigo);
    const snap = await get(salaRef);
    const sala = snap.val();
    const jugadores = Object.keys(sala.jugadores);
    if(jugadores.length < 3) return alert("Mínimo 3 jugadores");

    const impostores = [];
    const numImp = jugadores.length >= 5 ? 2 : 1;
    while(impostores.length < numImp){
      const elegido = jugadores[Math.floor(Math.random()*jugadores.length)];
      if(!impostores.includes(elegido)) impostores.push(elegido);
    }
    const futbolista = jugadoresFamosos[Math.floor(Math.random()*jugadoresFamosos.length)];

    const updates = { iniciada:true, enVotacion:false, futbolista, votos:{}, resultado:null };
    jugadores.forEach(j => {
      updates[`jugadores/${j}/rol`] = impostores.includes(j)? "impostor":"inocente";
      updates[`jugadores/${j}/vivo`] = true;
    });
    await update(salaRef, updates);
  }

  async function iniciarVotacion(codigo){
    const salaRef = ref(db, "salas/" + codigo);
    await update(salaRef, { enVotacion: true, votos: {} });
  }

  async function votar(codigo, votante, votado){
    await set(ref(db, `salas/${codigo}/votos/${votante}`), votado);
    const salaRef = ref(db, "salas/" + codigo);
    const snap = await get(salaRef);
    const sala = snap.val();
    const vivos = Object.values(sala.jugadores).filter(j=>j.vivo).length;
    const votos = Object.values(sala.votos).length;

    if(votos >= vivos){
      const conteo = {};
      for(const v of Object.values(sala.votos)) conteo[v]=(conteo[v]||0)+1;
      const expulsado = Object.entries(conteo).sort((a,b)=>b[1]-a[1])[0][0];
      const rol = sala.jugadores[expulsado].rol;
      if(rol==="impostor"){
        await update(salaRef,{ resultado:"¡Ganaron los inocentes! 🎉", enVotacion:false });
      } else {
        await update(salaRef,{ [`jugadores/${expulsado}/vivo`]:false, resultado:`${expulsado} no era el impostor 😬`, enVotacion:false });
      }
    }
  }

  function mostrarPantallaVotacion(codigo, nombre, info){
    const vivos = Object.values(info.jugadores).filter(j=>j.vivo).map(j=>j.nombre);
    document.body.innerHTML = `
      <div class="card">
        <h2>Votación</h2>
        <ul id="listaVotos">${vivos.map(v=>`<li data-voto="${v}">${v}</li>`).join("")}</ul>
      </div>`;
    document.querySelectorAll("#listaVotos li").forEach(li=>{
      li.onclick = ()=>votar(codigo, nombre, li.dataset.voto);
    });
  }

  function actualizarSala(s, codigo, miNombre){
    const sala = s.val();
    const jugadores = Object.values(sala.jugadores||{});
    document.getElementById("listaJugadores").innerHTML = jugadores.map(j=>`<li>${j.nombre}${j.vivo?"":" 💀"}</li>`).join("");
    document.getElementById("estadoSala").textContent = sala.iniciada ? (sala.enVotacion?"En votación":"Partida iniciada") : "Esperando...";

    const isHost = sala.host === miNombre;
    const btns = document.getElementById("botonesHost");
    btns.innerHTML = "";
    if(isHost && !sala.iniciada){
      const b = document.createElement("button");
      b.textContent="Iniciar Partida";
      b.onclick=()=>iniciarPartida(codigo);
      btns.appendChild(b);
    }
    if(isHost && sala.iniciada && !sala.enVotacion){
      const b2=document.createElement("button");
      b2.textContent="Iniciar votación";
      b2.onclick=()=>iniciarVotacion(codigo);
      btns.appendChild(b2);
    }

    const yo = sala.jugadores[miNombre];
    if(sala.resultado){
      document.body.innerHTML = `<div class="card"><h2>${sala.resultado}</h2><button onclick="location.reload()">Volver</button></div>`;
      return;
    }
    if(sala.iniciada && !sala.enVotacion && yo){
      if(yo.rol==="impostor"){
        document.body.innerHTML=`<div class="card"><h2>${miNombre}</h2><h3 style="color:gold">Eres el IMPOSTOR ⚠️</h3></div>`;
      }else{
        document.body.innerHTML=`<div class="card"><h2>${miNombre}</h2><h3>Jugador: ${sala.futbolista}</h3></div>`;
      }
      if(isHost){
        const vbtn=document.createElement("button");
        vbtn.textContent="Ir a votación";
        vbtn.onclick=()=>iniciarVotacion(codigo);
        document.body.querySelector(".card").appendChild(vbtn);
      }
    }
    if(sala.enVotacion){
      mostrarPantallaVotacion(codigo, miNombre, sala);
    }
  }

</script>
</body>
</html>
