<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Impostor Fútbol</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    button {
      background: #1f6feb;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #388bfd;
    }
    input {
      padding: 8px;
      width: 80%;
      border-radius: 6px;
      border: none;
      margin: 5px;
    }
  </style>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBB2m__o-fKBuQHbJ0jX1q78jCsGUjWRfo",
      authDomain: "impostor-futbol-79a3e.firebaseapp.com",
      databaseURL: "https://impostor-futbol-79a3e-default-rtdb.firebaseio.com",
      projectId: "impostor-futbol-79a3e",
      storageBucket: "impostor-futbol-79a3e.firebasestorage.app",
      messagingSenderId: "444634288697",
      appId: "1:444634288697:web:93398a6c5538df2684b3e8",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const jugadoresFamosos = [
      "Lionel Messi", "Cristiano Ronaldo", "Pelé", "Diego Maradona", "Zinedine Zidane",
      "Ronaldinho", "Kylian Mbappé", "Neymar Jr", "Erling Haaland", "Robert Lewandowski",
      "David Beckham", "Franz Beckenbauer", "Ronaldo Nazário", "Andrés Iniesta", "Xavi Hernández",
      "Thierry Henry", "Paolo Maldini", "George Best", "Luis Suárez", "Luka Modrić",
      "Gianluigi Buffon", "Mohamed Salah", "Sergio Ramos", "Carlos Valderrama", "James Rodríguez",
      "Didier Drogba", "Wayne Rooney", "Frank Lampard", "Steven Gerrard", "Iker Casillas",
      "Zlatan Ibrahimović", "Kaká", "Andrea Pirlo", "Clarence Seedorf", "Roberto Carlos",
      "Marcelo", "Virgil van Dijk", "Antoine Griezmann", "Edinson Cavani", "Rivaldo",
      "Samuel Eto'o", "Pavel Nedvěd", "Ruud Gullit", "Fernando Torres", "Phil Foden",
      "Jude Bellingham", "Enzo Fernández", "Sadio Mané", "Vinícius Jr", "Alisson Becker"
    ];

    // Función para generar código de sala
    function generarCodigo() {
      const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      return Array.from({ length: 6 }, () => letras[Math.floor(Math.random() * letras.length)]).join("");
    }

    // Crear una sala
    window.crearSala = async function() {
      const codigo = generarCodigo();
      const salaRef = ref(db, "salas/" + codigo);
      await set(salaRef, { jugadores: {}, iniciada: false });
      document.getElementById("menu").innerHTML = `
        <div class="card">
          <h3>Sala creada</h3>
          <p>Código de sala: <b>${codigo}</b></p>
          <input id="nombreJugador" placeholder="Tu nombre" />
          <button onclick="unirseSala('${codigo}', true)">Unirme</button>
        </div>
      `;
    }

    // Unirse a sala
    window.unirseSala = async function(codigoManual = null, esCreador = false) {
      const codigo = codigoManual || document.getElementById("codigoSala").value.trim().toUpperCase();
      const nombre = document.getElementById("nombreJugador").value.trim();

      if (!nombre) return alert("Ingresa un nombre");
      if (!codigo) return alert("Ingresa un código de sala");

      const salaRef = ref(db, "salas/" + codigo);
      const snapshot = await get(salaRef);
      if (!snapshot.exists()) return alert("Sala no encontrada");

      const jugadorRef = ref(db, "salas/" + codigo + "/jugadores/" + nombre);
      await set(jugadorRef, { nombre, rol: "esperando" });

      document.getElementById("menu").innerHTML = `
        <div class="card">
          <h3>Sala: ${codigo}</h3>
          <p>Esperando jugadores...</p>
          <div id="listaJugadores"></div>
          ${esCreador ? `<button onclick="iniciarPartida('${codigo}')">Iniciar Partida</button>` : ""}
        </div>
      `;

      onValue(salaRef, (data) => {
        const info = data.val();
        const lista = Object.values(info.jugadores || {}).map(j => `<li>${j.nombre}</li>`).join("");
        document.getElementById("listaJugadores").innerHTML = `<ul>${lista}</ul>`;

        if (info.iniciada && info.jugadores[nombre]) {
          const rol = info.jugadores[nombre].rol;
          const futbolista = info.futbolista;
          document.body.innerHTML = `
            <div class="card">
              <h2>Tu jugador: ${futbolista}</h2>
              <h3>${rol === "impostor" ? "Eres el IMPOSTOR ⚠️" : "Eres un jugador normal ⚽"}</h3>
            </div>
          `;
        }
      });
    }

    // Iniciar partida
    window.iniciarPartida = async function(codigo) {
      const salaRef = ref(db, "salas/" + codigo);
      const snapshot = await get(salaRef);
      const sala = snapshot.val();
      const jugadores = Object.keys(sala.jugadores);
      if (jugadores.length < 3) return alert("Se necesitan al menos 3 jugadores.");

      const futbolista = jugadoresFamosos[Math.floor(Math.random() * jugadoresFamosos.length)];
      let numImpostores = jugadores.length >= 5 ? 2 : 1;
      let impostores = [];

      while (impostores.length < numImpostores) {
        const rand = jugadores[Math.floor(Math.random() * jugadores.length)];
        if (!impostores.includes(rand)) impostores.push(rand);
      }

      let actualizacion = {};
      jugadores.forEach(j => {
        actualizacion["jugadores/" + j + "/rol"] = impostores.includes(j) ? "impostor" : "jugador";
      });
      actualizacion["iniciada"] = true;
      actualizacion["futbolista"] = futbolista;

      await update(salaRef, actualizacion);
    }
  </script>
</head>

<body>
  <div id="menu">
    <div class="card">
      <h1>⚽ El Impostor Fútbol</h1>
      <button onclick="crearSala()">Crear Sala</button>
      <hr>
      <input id="codigoSala" placeholder="Código de sala" maxlength="6" />
      <input id="nombreJugador" placeholder="Tu nombre" />
      <button onclick="unirseSala()">Unirse a Sala</button>
    </div>
  </div>
</body>
</html>
