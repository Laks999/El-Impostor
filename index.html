<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Impostor Fútbol</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .hidden { display: none; }
    button {
      background-color: #00b894;
      border: none;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background-color: #019670; }
    .card {
      background-color: #222;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
    }
  </style>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBB2m__o-fKBuQHbJ0jX1q78jCsGUjWRfo",
      authDomain: "impostor-futbol-79a3e.firebaseapp.com",
      databaseURL: "https://impostor-futbol-79a3e-default-rtdb.firebaseio.com",
      projectId: "impostor-futbol-79a3e",
      storageBucket: "impostor-futbol-79a3e.firebasestorage.app",
      messagingSenderId: "444634288697",
      appId: "1:444634288697:web:93398a6c5538df2684b3e8",
      measurementId: "G-HBKTSZLNMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Lista de jugadores famosos (base interna)
    const futbolistas = [
      "Messi","Cristiano Ronaldo","Pelé","Maradona","Ronaldinho","Zidane","Neymar",
      "Mbappé","Xavi","Iniesta","Modric","Beckham","Ronaldo Nazário","Henry","Maldini",
      "Buffon","Casillas","Lewandowski","Salah","Benzema","Kroos","Van Dijk","Sergio Ramos",
      "Pirlo","Kaká","Eto'o","Rooney","Hazard","Drogba","Puyol","Figo","Baggio","Zico",
      "Cantona","George Best","Rivaldo","Batistuta","Totti","Raúl","Stoichkov","Del Piero",
      "Shevchenko","Ozil","Lampard","Gerrard","Robben","Ribéry","Suárez","Vini Jr","Haaland","Alisson"
    ];

    // Variables de juego
    let isHost = false;
    let playerName = "";
    let currentRoom = "";
    let myIndex = 0;
    let roles = [];

    window.createRoom = async function() {
      isHost = true;
      currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById("mainMenu").classList.add("hidden");
      document.getElementById("gameSetup").classList.remove("hidden");
      document.getElementById("roomCodeDisplay").innerText = "Código de sala: " + currentRoom;
      await set(ref(db, "rooms/" + currentRoom), { players: [], started: false });
    };

    window.joinRoom = async function() {
      const code = prompt("Ingresa el código de sala:");
      if (!code) return;
      const snapshot = await get(ref(db, "rooms/" + code));
      if (!snapshot.exists()) {
        alert("Esa sala no existe.");
        return;
      }
      currentRoom = code;
      isHost = false;
      document.getElementById("mainMenu").classList.add("hidden");
      document.getElementById("playerJoin").classList.remove("hidden");
    };

    window.addPlayer = async function() {
      playerName = document.getElementById("playerName").value.trim();
      if (!playerName) return alert("Escribe tu nombre.");
      const roomRef = ref(db, "rooms/" + currentRoom + "/players");
      const snapshot = await get(roomRef);
      const players = snapshot.exists() ? snapshot.val() : [];
      players.push(playerName);
      await set(roomRef, players);
      document.getElementById("playerJoin").classList.add("hidden");
      document.getElementById("waiting").classList.remove("hidden");
      document.getElementById("waitingCode").innerText = "Código de sala: " + currentRoom;
    };

    window.startGame = async function() {
      const numPlayers = document.getElementById("numPlayers").value;
      const impostorCount = document.getElementById("impostorCount").value;
      const roomRef = ref(db, "rooms/" + currentRoom);
      const snapshot = await get(ref(db, "rooms/" + currentRoom + "/players"));
      const players = snapshot.exists() ? snapshot.val() : [];

      if (players.length < 3) return alert("Mínimo 3 jugadores para iniciar.");

      const jugador = futbolistas[Math.floor(Math.random() * futbolistas.length)];
      let impostores = [];
      while (impostores.length < impostorCount) {
        let idx = Math.floor(Math.random() * players.length);
        if (!impostores.includes(idx)) impostores.push(idx);
      }

      roles = players.map((p, i) => impostores.includes(i) ? "IMPOSTOR" : jugador);

      await set(roomRef, { players, roles, started: true });

      document.getElementById("gameSetup").classList.add("hidden");
      document.getElementById("waiting").classList.remove("hidden");
      alert("Partida iniciada.");
    };

    onValue(ref(db, "rooms"), snapshot => {
      if (!snapshot.exists()) return;
      const rooms = snapshot.val();
      if (!rooms[currentRoom]) return;
      const data = rooms[currentRoom];
      if (data.started && roles.length === 0 && data.roles) {
        roles = data.roles;
        showPlayerCard(data.players);
      }
    });

    function showPlayerCard(players) {
      myIndex = players.indexOf(playerName);
      if (myIndex === -1) return;

      document.getElementById("waiting").classList.add("hidden");
      document.getElementById("playerCard").classList.remove("hidden");

      const cardText = roles[myIndex] === "IMPOSTOR"
        ? "ERES EL IMPOSTOR"
        : "Tu jugador es: " + roles[myIndex];

      document.getElementById("roleText").innerText = cardText;

      if (isHost) {
        document.getElementById("nextRoundBtn").classList.remove("hidden");
      }
    }

    window.playNextRound = async function() {
      const snapshot = await get(ref(db, "rooms/" + currentRoom + "/players"));
      const players = snapshot.exists() ? snapshot.val() : [];
      const jugador = futbolistas[Math.floor(Math.random() * futbolistas.length)];
      const impostorCount = Math.random() < 0.5 ? 1 : 2;
      let impostores = [];
      while (impostores.length < impostorCount) {
        let idx = Math.floor(Math.random() * players.length);
        if (!impostores.includes(idx)) impostores.push(idx);
      }
      roles = players.map((p, i) => impostores.includes(i) ? "IMPOSTOR" : jugador);
      await set(ref(db, "rooms/" + currentRoom + "/roles"), roles);
      alert("Nueva ronda iniciada.");
    };

    window.goToMenu = function() {
      location.reload();
    };
  </script>
</head>
<body>
  <div id="mainMenu">
    <h1>⚽ El Impostor Fútbol</h1>
    <button onclick="createRoom()">Crear Sala</button>
    <button onclick="joinRoom()">Unirse a Sala</button>
  </div>

  <div id="gameSetup" class="hidden">
    <h2 id="roomCodeDisplay"></h2>
    <label>Número de jugadores: </label>
    <input type="number" id="numPlayers" min="3" max="15" value="3"><br>
    <label>Cantidad de impostores: </label>
    <input type="number" id="impostorCount" min="1" max="2" value="1"><br>
    <button onclick="startGame()">Iniciar Partida</button>
    <button onclick="goToMenu()">Salir al menú</button>
  </div>

  <div id="playerJoin" class="hidden">
    <h2>Unirse a Sala</h2>
    <input id="playerName" placeholder="Tu nombre" /><br>
    <button onclick="addPlayer()">Unirse</button>
    <button onclick="goToMenu()">Salir al menú</button>
  </div>

  <div id="waiting" class="hidden">
    <h2>Esperando a que inicie la partida...</h2>
    <p id="waitingCode"></p>
    <button onclick="goToMenu()">Salir al menú</button>
  </div>

  <div id="playerCard" class="hidden">
    <div class="card">
      <h2 id="roleText"></h2>
    </div>
    <button id="nextRoundBtn" class="hidden" onclick="playNextRound()">Jugar otra ronda</button>
    <button onclick="goToMenu()">Salir al menú principal</button>
  </div>
</body>
</html>
